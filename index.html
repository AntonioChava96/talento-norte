<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talento Norte | Reclutamiento y selección</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--r:#0e8f89;--n:#14294d;--bg:#fff;--bg2:#f5f6f8;--ink:#14294d;--mut:#5d6470;--line:#e4e6ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--bg2:#1c1f25;--ink:#f2f3f5;--mut:#a2a8b3;--line:#2c3038;--n:#1f3a66}}
:root[data-theme="dark"]{--bg:#14161a;--bg2:#1c1f25;--ink:#f2f3f5;--mut:#a2a8b3;--line:#2c3038;--n:#1f3a66}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3,.f{font-family:Montserrat,system-ui,sans-serif;line-height:1.12;margin:0}
a{color:inherit}
.w{max-width:1120px;margin:0 auto;padding:0 22px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header .w{display:flex;align-items:center;gap:28px;height:68px}
.logo{font:800 20px Montserrat,sans-serif;text-decoration:none;display:flex;align-items:center;gap:9px}
.logo img{height:46px;width:auto}.logo span{display:flex;flex-direction:column;line-height:1;text-transform:uppercase}.logo b{font-weight:800;font-size:19px;letter-spacing:.02em}.logo em{font-style:normal;font-weight:500;font-size:19px;letter-spacing:.14em}#lgn{position:fixed;inset:0;background:#000a;z-index:70;display:none;place-items:center;padding:20px}#lgn.open{display:grid}#lgn .card{width:min(380px,100%)}#lerr{color:#c0392b;font-size:14px;min-height:20px;margin:0 0 10px}
nav{display:flex;gap:6px;margin-left:auto}
nav a{text-decoration:none;font-weight:500;font-size:15px;padding:22px 10px;border-bottom:3px solid transparent}
nav a:hover,nav a.on{color:var(--r);border-color:var(--r)}
.btn{background:var(--r);color:#fff;border:0;border-radius:999px;padding:12px 22px;font:700 14px Montserrat,sans-serif;cursor:pointer;text-decoration:none;display:inline-block;box-shadow:0 8px 22px -8px var(--r)}
.btn.o{background:none;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
:focus-visible{outline:3px solid var(--r);outline-offset:2px}
section{padding:84px 0}
.alt{background:var(--bg2)}
.hero{padding:70px 0 90px}
.hero .w{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(34px,5vw,58px);font-weight:800}
.hero h1 b{color:var(--r)}
.hero p{color:var(--mut);max-width:480px;font-size:18px;margin:22px 0 30px}
.vis{position:relative;background:var(--n);border-radius:26px;min-height:380px;display:grid;place-items:center;padding:30px}
.cand{background:var(--bg);border-radius:18px;padding:22px;width:min(300px,100%);box-shadow:0 20px 40px -18px #0007}
.cand .av{width:54px;height:54px;border-radius:50%;background:var(--bg2);border:2px solid var(--r);margin-bottom:12px}
.ln{height:9px;border-radius:5px;background:var(--line);margin:9px 0}
.chip{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500;margin-top:12px}
.chip s{width:18px;height:18px;border-radius:50%;background:var(--r);text-decoration:none;color:#fff;font-size:11px;display:grid;place-items:center}
.fl{border-left:5px solid #e9a23b;position:absolute;left:-26px;top:34px;background:var(--bg);border-radius:16px;padding:14px 20px;box-shadow:0 14px 34px -12px #0006}
.fl b{font:800 22px Montserrat,sans-serif;display:block}
.fl span{font-size:13px;color:var(--mut)}
h2{font-size:clamp(28px,3.4vw,40px);font-weight:800;max-width:700px}
.sub{color:var(--mut);max-width:560px;margin:14px 0 40px}
.g{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:26px}
.alt .card{border-color:transparent}
.card h3{font-size:19px;margin-bottom:8px}
.card p{margin:0;color:var(--mut);font-size:15px}
.card .ic{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--r) 12%,transparent);color:var(--r);display:grid;place-items:center;font:800 17px Montserrat;margin-bottom:16px}
.about{display:grid;grid-template-columns:1.1fr 1fr;gap:50px;align-items:start}
.about p{color:var(--mut)}
.mv{display:grid;gap:14px}
.mv div{border-left:4px solid var(--r);padding:4px 0 4px 18px}
.mv h3{font-size:16px}.mv p{margin:4px 0 0;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px;margin-top:50px}
.stats b{font:800 38px Montserrat;color:var(--r);display:block}
.stats span{color:var(--mut);font-size:14px}
.steps{counter-reset:s;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.steps .card{counter-increment:s;position:relative;padding-top:50px}
.steps .card:before{content:counter(s);position:absolute;top:14px;left:26px;font:800 24px Montserrat;color:var(--r)}
.vac{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 24px;margin-bottom:12px;flex-wrap:wrap}
.vac h3{font-size:18px}.vac p{font-size:14px}
.contact{display:grid;grid-template-columns:1fr 1.1fr;gap:44px}
.ci p{margin:0 0 14px;color:var(--mut)}.ci b{display:block;color:var(--ink);font-size:14px}
input,textarea,select{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:12px}
textarea{min-height:110px;resize:vertical}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mut);font-size:14px}
footer .w{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer button{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;text-decoration:underline}
.wa{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#25d366;color:#fff;border-radius:999px;padding:13px 20px;font:700 14px Montserrat;text-decoration:none;box-shadow:0 10px 26px -8px #0006;z-index:15}
/* panel */
#adm{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;grid-template-columns:210px 1fr;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
#adm.open{display:grid}
#side{background:var(--bg2);border-right:1px solid var(--line);padding:18px 12px;overflow:auto}
#side h3{font-size:16px;margin:0 8px 14px}
#side button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:9px;font:500 15px Inter;color:var(--ink);cursor:pointer}
#side button.on{background:var(--r);color:#fff}
#main{overflow:auto;padding:26px 30px 80px}
#main h2{font-size:26px;margin-bottom:6px}
.fld label{font-size:13px;font-weight:500;color:var(--mut);display:block;margin-bottom:4px}
.it{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--bg2)}
.sm{padding:8px 14px;font-size:13px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
#tst{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none}
#tst.on{opacity:1}
@media(max-width:820px){nav{display:none}.hero .w,.about,.contact{grid-template-columns:1fr}.fl{left:10px;top:-18px}#adm{grid-template-columns:1fr;grid-template-rows:auto 1fr}#side{display:flex;overflow-x:auto;gap:6px;padding:10px;border-right:0;border-bottom:1px solid var(--line)}#side h3{display:none}#side button{width:auto;white-space:nowrap}#main{padding:20px 16px 80px}header .btn{margin-left:auto}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

 }else Object.keys(d).forEach(k=>m.append(field(d,k)));
 const bar=document.createElement("div");bar.className="bar";bar.innerHTML='<button class="btn o sm" id="ex">Exportar datos</button><button class="btn o sm" id="im">Importar datos</button><button class="btn o sm" id="rs">Restablecer</button>';
 m.append(bar);
 $("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:"application/json"}));a.download="datos-sitio.json";a.click()};
 $("#im").onclick=()=>{const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>i.files[0].text().then(t=>{try{D=Object.assign(structuredClone(DEF),JSON.parse(t));save();render();panel();toast("Datos importados")}catch(x){toast("Archivo no válido")}});i.click()};
 $("#rs").onclick=()=>{if(confirm("¿Restablecer todo el contenido de ejemplo?")){D=structuredClone(DEF);save();render();panel()}};
}
const DEFPASS="TalentoNorte2026";
let A=(()=>{try{const x=localStorage.getItem("tn_auth");if(x)return JSON.parse(x)}catch(_){}return{u:"admin",def:true}})();
let fails=0,lockUntil=0;
async function hp(p,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]);const b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:150000,hash:"SHA-256"},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function auth(u,p){if(sb){const{error}=await sb.auth.signInWithPassword({email:u,password:p});return !error}return u===A.u&&await chk(p)}
const chk=async p=>A.def?p===DEFPASS:await hp(p,A.s)===A.h;
$("#open").onclick=()=>{$("#lgn").classList.add("open");$("#lu").focus()};
$("#lx").onclick=()=>$("#lgn").classList.remove("open");
$("#lf").onsubmit=async ev=>{ev.preventDefault();
 if(Date.now()<lockUntil)return $("#lerr").textContent="Demasiados intentos. Espera "+Math.ceil((lockUntil-Date.now())/1000)+" s.";
 const u=$("#lu").value.trim(),p=$("#lp").value;
 if(await auth(u,p)){fails=0;$("#lp").value="";$("#lerr").textContent="";$("#lgn").classList.remove("open");$("#adm").classList.add("open");panel()}
 else{if(++fails>=5){lockUntil=Date.now()+60000;fails=0}$("#lerr").textContent="Usuario o contraseña incorrectos."}};
function secSb(m){
 m.innerHTML+='<p class="sub">Sesión iniciada con tu cuenta de Supabase. Los usuarios se administran desde el panel de Supabase.</p><div class="fld"><label>Contraseña nueva (mínimo 10 caracteres)</label><input id="sn" type="password" autocomplete="new-password"></div><button class="btn sm" id="ss">Cambiar contraseña</button>';
 $("#ss").onclick=async()=>{const n=$("#sn").value;if(n.length<10)return toast("Mínimo 10 caracteres");const{error}=await sb.auth.updateUser({password:n});toast(error?"No se pudo cambiar":"Contraseña actualizada");$("#sn").value=""}}
function secPanel(m){if(sb)return secSb(m);
 m.innerHTML+=`${A.def?'<p class="card" style="margin-bottom:16px;border-color:var(--r)">Estás usando el acceso de ejemplo. Cambia usuario y contraseña ahora.</p>':""}<div class="fld"><label>Usuario</label><input id="su" value="${e(A.u)}" autocomplete="username"></div><div class="fld"><label>Contraseña actual</label><input id="sc" type="password" autocomplete="current-password"></div><div class="fld"><label>Contraseña nueva (mínimo 10 caracteres)</label><input id="sn" type="password" autocomplete="new-password"></div><div class="fld"><label>Repetir contraseña nueva</label><input id="sr" type="password" autocomplete="new-password"></div><button class="btn sm" id="ss">Guardar acceso</button>`;
 $("#ss").onclick=async()=>{const u=$("#su").value.trim(),n=$("#sn").value;
  if(!await chk($("#sc").value))return toast("La contraseña actual no es correcta");
  if(u.length<3||n.length<10||n!==$("#sr").value)return toast("Revisa usuario, longitud y que las contraseñas coincidan");
  const s=crypto.randomUUID();A={u,s,h:await hp(n,s)};try{localStorage.setItem("tn_auth",JSON.stringify(A))}catch(_){}toast("Acceso actualizado");panel()}}
if(sb)pull();else render();
</script>
